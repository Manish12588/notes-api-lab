services:
  mysql:
    image: mysql:8.0
    container_name: notes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: notesdb
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - notes_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: notes-phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  notes_data: